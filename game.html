<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>mSnake Demo - Void Arena & Plasma Snake</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #000;
    }
    #hud {
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.7);
      border-bottom: 1px solid rgba(0, 245, 160, 0.2);
    }
    .hud-card {
      background: rgba(10, 10, 15, 0.85);
      border: 1px solid rgba(0, 245, 160, 0.25);
      border-radius: 12px;
      padding: 4px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 68px;
    }
    .hud-label {
      font-size: 8px;
      font-weight: 800;
      color: #00f5a0;
      letter-spacing: 1px;
    }
    .hud-val {
      font-size: 15px;
      font-weight: 900;
      color: #fff;
    }
    #xp-container {
      flex: 1;
      margin: 0 10px;
      background: rgba(10, 10, 15, 0.85);
      border: 1px solid rgba(0, 245, 160, 0.25);
      border-radius: 12px;
      padding: 6px 10px;
    }
    .xp-top {
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 4px;
    }
    .xp-bar-bg {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
    }
    #xp-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #00d9ff, #00f5a0);
    }
    canvas {
      flex: 1;
      width: 100%;
      display: block;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }
    .modal {
      background: #050509;
      border: 1px solid #00f5a0;
      border-radius: 24px;
      padding: 24px;
      width: 82%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 0 35px rgba(0, 245, 160, 0.25);
    }
    .modal h1 {
      color: #fff;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }
    .modal p {
      color: #aaa;
      font-size: 13px;
      margin-bottom: 20px;
    }
    .btn {
      width: 100%;
      height: 48px;
      background: #00f5a0;
      color: #000;
      font-weight: 900;
      font-size: 15px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      letter-spacing: 1.5px;
    }
    .btn:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="hud">
      <div class="hud-card">
        <span class="hud-label">SCORE</span>
        <span class="hud-val" id="score-val">0</span>
      </div>
      <div id="xp-container">
        <div class="xp-top">
          <span id="lvl-txt">LVL 1</span>
          <span id="xp-txt" style="color: #00f5a0;">0 XP</span>
        </div>
        <div class="xp-bar-bg">
          <div id="xp-fill"></div>
        </div>
      </div>
      <div class="hud-card">
        <span class="hud-label">BEST</span>
        <span class="hud-val" id="best-val">0</span>
      </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="game-over-overlay" class="overlay" style="display: none;">
      <div class="modal">
        <h1>GAME OVER</h1>
        <p id="game-over-sub">Score: 0</p>
        <button class="btn" id="restart-btn">PLAY AGAIN</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreVal = document.getElementById('score-val');
    const bestVal = document.getElementById('best-val');
    const lvlTxt = document.getElementById('lvl-txt');
    const xpTxt = document.getElementById('xp-txt');
    const xpFill = document.getElementById('xp-fill');
    const gameOverOverlay = document.getElementById('game-over-overlay');
    const gameOverSub = document.getElementById('game-over-sub');
    const restartBtn = document.getElementById('restart-btn');

    const THEME = {
      background: '#050509',
      board: '#080b10',
      grid: '#304050',
      primary: '#00f5a0',
      secondary: '#00d9ff',
      food: '#ff3d71'
    };

    let boardCols = 16;
    let boardRows = 26;
    let cellW = 0, cellH = 0;

    function resize() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      cellW = canvas.width / boardCols;
      cellH = canvas.height / boardRows;
    }
    window.addEventListener('resize', resize);

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, duration) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    let snake = [];
    let prevSnake = [];
    let direction = { x: 1, y: 0 };
    let pendingDirection = { x: 1, y: 0 };
    let foods = [];
    let specialFood = null;
    let shrinkFood = null;
    let score = 0;
    let highScore = localStorage.getItem('msnake_hs_void') || 0;
    let isGameOver = false;
    let turboTicks = 0;
    let lastStepTime = performance.now();
    let moveProgress = 0;
    let arenaPhase = 0;
    let foodPulse = 1;
    let lastPlasmaEatTime = 0;

    bestVal.textContent = highScore;

    function resetGame() {
      const startX = Math.floor(boardCols / 2);
      const startY = Math.floor(boardRows / 2);
      snake = [
        { x: startX, y: startY },
        { x: startX - 1, y: startY },
        { x: startX - 2, y: startY },
        { x: startX - 3, y: startY }
      ];
      prevSnake = JSON.parse(JSON.stringify(snake));
      direction = { x: 1, y: 0 };
      pendingDirection = { x: 1, y: 0 };
      score = 0;
      turboTicks = 0;
      isGameOver = false;
      lastPlasmaEatTime = 0;
      gameOverOverlay.style.display = 'none';

      foods = [];
      for (let i = 0; i < 3; i++) spawnFood();
      specialFood = null;
      shrinkFood = null;
      updateHUD();
      resize();
    }

    function spawnFood() {
      const emptyCells = [];
      for (let y = 0; y < boardRows; y++) {
        for (let x = 0; x < boardCols; x++) {
          if (!snake.some(s => s.x === x && s.y === y) &&
              !foods.some(f => f.x === x && f.y === y)) {
            emptyCells.push({ x, y });
          }
        }
      }
      if (emptyCells.length > 0) {
        foods.push(emptyCells[Math.floor(Math.random() * emptyCells.length)]);
      }
    }

    function updateHUD() {
      scoreVal.textContent = score;
      if (score > highScore) {
        highScore = score;
        bestVal.textContent = highScore;
        localStorage.setItem('msnake_hs_void', highScore);
      }
      const lvl = Math.floor(score / 300) + 1;
      const curLvlBase = (lvl - 1) * 300;
      const progress = Math.min(1, Math.max(0, (score - curLvlBase) / 300));
      lvlTxt.textContent = `LVL ${lvl}`;
      xpTxt.textContent = `${Math.floor(score / 10)} XP`;
      xpFill.style.width = `${progress * 100}%`;
    }

    function getTickDelay() {
      const lvl = Math.floor(score / 300) + 1;
      let delay = 300 - (lvl * 20);
      if (delay < 150) delay = 150;
      return turboTicks > 0 ? 65 : delay;
    }

    function step() {
      direction = pendingDirection;
      prevSnake = JSON.parse(JSON.stringify(snake));
      const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

      if (head.x < 0 || head.x >= boardCols || head.y < 0 || head.y >= boardRows) {
        endGame();
        return;
      }
      if (snake.some((seg, idx) => idx !== snake.length - 1 && seg.x === head.x && seg.y === head.y)) {
        endGame();
        return;
      }

      snake.unshift(head);
      if (turboTicks > 0) turboTicks--;

      const foodIdx = foods.findIndex(f => f.x === head.x && f.y === head.y);
      if (foodIdx !== -1) {
        score += 10;
        lastPlasmaEatTime = performance.now();
        playBeep(680, 0.08);
        foods.splice(foodIdx, 1);
        spawnFood();
        if (!specialFood && Math.random() < 0.25) {
          specialFood = { x: Math.floor(Math.random() * boardCols), y: Math.floor(Math.random() * boardRows) };
        }
        if (!shrinkFood && score >= 120 && Math.random() < 0.20) {
          shrinkFood = { x: Math.floor(Math.random() * boardCols), y: Math.floor(Math.random() * boardRows) };
        }
        updateHUD();
      } else if (specialFood && specialFood.x === head.x && specialFood.y === head.y) {
        score += 100;
        lastPlasmaEatTime = performance.now();
        playBeep(920, 0.14);
        specialFood = null;
        updateHUD();
      } else if (shrinkFood && shrinkFood.x === head.x && shrinkFood.y === head.y) {
        playBeep(520, 0.12);
        shrinkFood = null;
        const removeCount = Math.min(5, snake.length - 3);
        for (let i = 0; i < removeCount; i++) snake.pop();
        updateHUD();
      } else {
        snake.pop();
      }
    }

    function endGame() {
      isGameOver = true;
      playBeep(160, 0.35);
      gameOverSub.textContent = `Score: ${score}`;
      gameOverOverlay.style.display = 'flex';
    }

    restartBtn.addEventListener('click', resetGame);

    window.addEventListener('keydown', e => {
      if ((e.key === 'ArrowUp' || e.key === 'w') && direction.y !== 1) pendingDirection = { x: 0, y: -1 };
      else if ((e.key === 'ArrowDown' || e.key === 's') && direction.y !== -1) pendingDirection = { x: 0, y: 1 };
      else if ((e.key === 'ArrowLeft' || e.key === 'a') && direction.x !== 1) pendingDirection = { x: -1, y: 0 };
      else if ((e.key === 'ArrowRight' || e.key === 'd') && direction.x !== -1) pendingDirection = { x: 1, y: 0 };
    });

    let touchStartX = 0, touchStartY = 0, lastTap = 0;
    canvas.addEventListener('touchstart', e => {
      const now = performance.now();
      if (now - lastTap < 260) {
        turboTicks = 8;
        playBeep(980, 0.05);
      }
      lastTap = now;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    canvas.addEventListener('touchmove', e => {
      if (!touchStartX || !touchStartY) return;
      const dx = e.touches[0].clientX - touchStartX;
      const dy = e.touches[0].clientY - touchStartY;
      if (Math.abs(dx) > 16 || Math.abs(dy) > 16) {
        if (Math.abs(dx) > Math.abs(dy)) {
          if (dx > 0 && direction.x !== -1) pendingDirection = { x: 1, y: 0 };
          else if (dx < 0 && direction.x !== 1) pendingDirection = { x: -1, y: 0 };
        } else {
          if (dy > 0 && direction.y !== -1) pendingDirection = { x: 0, y: 1 };
          else if (dy < 0 && direction.y !== 1) pendingDirection = { x: 0, y: -1 };
        }
        touchStartX = 0;
        touchStartY = 0;
      }
    }, { passive: true });

    function drawVoidBackdrop(w, h, p) {
      const pi2 = 2 * Math.PI;

      const bgGrad = ctx.createRadialGradient(w * 0.5, h * 0.45, 0, w * 0.5, h * 0.45, w * 0.95);
      bgGrad.addColorStop(0, '#04060e');
      bgGrad.addColorStop(0.5, '#020308');
      bgGrad.addColorStop(1, '#000103');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, w, h);

      const breathing = 0.5 + 0.5 * Math.sin(p * 1.5);
      const coreGrad = ctx.createRadialGradient(w * 0.5, h * 0.45, 0, w * 0.5, h * 0.45, w * 0.75);
      coreGrad.addColorStop(0, `rgba(0, 245, 160, ${0.12 + breathing * 0.05})`);
      coreGrad.addColorStop(0.4, 'rgba(0, 217, 255, 0.05)');
      coreGrad.addColorStop(1, 'transparent');
      ctx.fillStyle = coreGrad;
      ctx.beginPath();
      ctx.arc(w * 0.5, h * 0.45, w * 0.75, 0, pi2);
      ctx.fill();

      const horizonY = h * 0.58;
      const gridLines = 8;
      for (let i = 0; i <= gridLines; i++) {
        const frac = i / gridLines;
        const xBottom = w * (-0.1 + frac * 1.2);
        const xTop = w * (0.3 + frac * 0.4);

        const lineGrad = ctx.createLinearGradient(0, horizonY, 0, h);
        lineGrad.addColorStop(0, 'transparent');
        lineGrad.addColorStop(0.5, 'rgba(0, 245, 160, 0.09)');
        lineGrad.addColorStop(1, 'rgba(0, 217, 255, 0.02)');

        ctx.strokeStyle = lineGrad;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(xTop, horizonY);
        ctx.lineTo(xBottom, h);
        ctx.stroke();
      }

      const rungs = 7;
      for (let r = 1; r <= rungs; r++) {
        const rFrac = Math.pow(r / rungs, 2);
        const rungY = horizonY + (h - horizonY) * rFrac;
        const rungAlpha = 0.03 + rFrac * 0.10;

        ctx.strokeStyle = `rgba(0, 245, 160, ${rungAlpha})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, rungY);
        ctx.lineTo(w, rungY);
        ctx.stroke();
      }

      for (let i = 0; i < 35; i++) {
        const seed = i;
        const speedCycle = 1 + (i % 3);
        const prog = ((p / pi2 * speedCycle) + seed * 0.073) % 1;

        const orbitR = w * (0.15 + (1 - prog) * 0.55);
        const angle = seed * 1.45 + (prog * pi2);
        const px = w * 0.5 + Math.cos(angle) * orbitR;
        const py = h * 0.45 + Math.sin(angle) * orbitR * 0.75;

        const pAlpha = Math.max(0, Math.min(1, Math.sin(prog * Math.PI) * 0.5));
        const color = (i % 2 === 0) ? `rgba(0, 245, 160, ${pAlpha})` : `rgba(0, 217, 255, ${pAlpha})`;
        const pRadius = 1.2 + (i % 3) * 0.6;

        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(px, py, pRadius, 0, pi2);
        ctx.fill();
      }

      const vigGrad = ctx.createRadialGradient(w * 0.5, h * 0.5, 0, w * 0.5, h * 0.5, w * 0.85);
      vigGrad.addColorStop(0, 'transparent');
      vigGrad.addColorStop(1, 'rgba(0, 0, 0, 0.65)');
      ctx.fillStyle = vigGrad;
      ctx.fillRect(0, 0, w, h);
    }

    function drawBoundaries(w, h) {
      const inset = 2.5;
      ctx.lineCap = 'round';

      ctx.strokeStyle = 'rgba(0, 245, 160, 0.78)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(inset, inset);
      ctx.lineTo(w - inset, inset);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(0, 217, 255, 0.30)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(inset, 6.5);
      ctx.lineTo(w - inset, 6.5);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(0, 245, 160, 0.78)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(inset, h - inset);
      ctx.lineTo(w - inset, h - inset);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(0, 217, 255, 0.30)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(inset, h - 6.5);
      ctx.lineTo(w - inset, h - 6.5);
      ctx.stroke();
    }

    function drawFoods() {
      const pulse = foodPulse;
      foods.forEach((f, idx) => {
        const cx = (f.x + 0.5) * cellW;
        const cy = (f.y + 0.5) * cellH;
        const baseRadius = Math.min(cellW, cellH) * 0.30 * pulse;

        ctx.fillStyle = 'rgba(255, 61, 113, 0.18)';
        ctx.beginPath();
        ctx.arc(cx, cy, baseRadius * 2.3, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ff3d71';
        ctx.beginPath();
        ctx.arc(cx, cy, baseRadius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.beginPath();
        ctx.arc(cx - baseRadius * 0.3, cy - baseRadius * 0.3, baseRadius * 0.28, 0, Math.PI * 2);
        ctx.fill();
      });

      if (specialFood) {
        const cx = (specialFood.x + 0.5) * cellW;
        const cy = (specialFood.y + 0.5) * cellH;
        const baseRadius = Math.min(cellW, cellH) * 0.38 * pulse;

        ctx.fillStyle = 'rgba(255, 0, 255, 0.25)';
        ctx.beginPath();
        ctx.arc(cx, cy, baseRadius * 2.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255, 0, 255, 0.45)';
        ctx.beginPath();
        ctx.arc(cx, cy, baseRadius * 1.4, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ff00ff';
        ctx.beginPath();
        ctx.moveTo(cx, cy - baseRadius);
        ctx.lineTo(cx + baseRadius, cy);
        ctx.lineTo(cx, cy + baseRadius);
        ctx.lineTo(cx - baseRadius, cy);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.beginPath();
        ctx.arc(cx, cy, baseRadius * 0.32, 0, Math.PI * 2);
        ctx.fill();
      }

      if (shrinkFood) {
        const cx = (shrinkFood.x + 0.5) * cellW;
        const cy = (shrinkFood.y + 0.5) * cellH;
        const baseRadius = Math.min(cellW, cellH) * 0.34 * pulse;

        ctx.fillStyle = 'rgba(0, 229, 255, 0.20)';
        ctx.beginPath();
        ctx.arc(cx, cy, baseRadius * 2.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(0, 229, 255, 0.16)';
        ctx.beginPath();
        ctx.arc(cx, cy, baseRadius * 1.55, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#00e5ff';
        ctx.beginPath();
        ctx.arc(cx, cy, baseRadius, 0, Math.PI * 2);
        ctx.fill();

        const markRadius = baseRadius * 0.10;
        const markDistance = baseRadius * 0.48;
        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        for (let i = 0; i < 5; i++) {
          const angle = (i * 72 - 90) * (Math.PI / 180);
          ctx.beginPath();
          ctx.arc(cx + Math.cos(angle) * markDistance, cy + Math.sin(angle) * markDistance, markRadius, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = Math.max(2, baseRadius * 0.13);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(cx - baseRadius * 0.38, cy);
        ctx.lineTo(cx + baseRadius * 0.38, cy);
        ctx.stroke();
      }
    }

    function drawPlasmaSnake(centers, radius, dir) {
      const elapsed = performance.now() - lastPlasmaEatTime;
      const surge = (elapsed >= 0 && elapsed <= 1200) ? (1 - elapsed / 1200) : 0;

      const baseArcColor = { r: 0, g: 245, b: 255 };
      const surgeArcColor = { r: 255, g: 215, b: 0 };
      const activeR = Math.round(baseArcColor.r * (1 - surge) + surgeArcColor.r * surge);
      const activeG = Math.round(baseArcColor.g * (1 - surge) + surgeArcColor.g * surge);
      const activeB = Math.round(baseArcColor.b * (1 - surge) + surgeArcColor.b * surge);

      for (let i = 0; i < centers.length - 1; i++) {
        const p1 = centers[i];
        const p2 = centers[i + 1];
        const distSq = Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2);

        if (distSq < radius * radius * 18 && distSq > 0) {
          const dx = p2.x - p1.x;
          const dy = p2.y - p1.y;
          const d = Math.hypot(dx, dy);
          const nx = (d > 0.001) ? -dy / d : 0;
          const ny = (d > 0.001) ? dx / d : 0;

          const boltWidth = (Math.random() - 0.5) * radius * (1.2 + surge * 0.8);
          const midX = (p1.x + p2.x) * 0.5 + nx * boltWidth;
          const midY = (p1.y + p2.y) * 0.5 + ny * boltWidth;

          ctx.lineCap = 'round';

          ctx.strokeStyle = `rgba(${activeR}, ${activeG}, ${activeB}, ${surge > 0 ? 0.6 : 0.25})`;
          ctx.lineWidth = surge > 0 ? 6 : 3;
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(midX, midY);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();

          ctx.strokeStyle = `rgb(${activeR}, ${activeG}, ${activeB})`;
          ctx.lineWidth = surge > 0 ? 3.5 : 1.8;
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(midX, midY);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();

          if (surge > 0) {
            ctx.strokeStyle = `rgba(255, 255, 255, ${surge * 0.9})`;
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(midX, midY);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
          }
        }
      }

      for (let i = centers.length - 1; i >= 0; i--) {
        const c = centers[i];
        const wave = 0.5 + 0.5 * Math.sin(foodPulse * 7 + i * 0.75);
        const core = (i % 2 === 0) ? '#00f5ff' : '#ff007f';
        const secondary = (i % 2 === 0) ? '#7b2cff' : '#00e5ff';

        ctx.fillStyle = (i % 2 === 0) ? `rgba(123, 44, 255, ${0.08 + wave * 0.08})` : `rgba(0, 229, 255, ${0.08 + wave * 0.08})`;
        ctx.beginPath();
        ctx.arc(c.x, c.y, radius * 2.15, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = (i % 2 === 0) ? `rgba(0, 245, 255, ${0.16 + wave * 0.12})` : `rgba(255, 0, 127, ${0.16 + wave * 0.12})`;
        ctx.beginPath();
        ctx.arc(c.x, c.y, radius * 1.55, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = (i % 2 === 0) ? 'rgba(0, 245, 255, 0.24)' : 'rgba(255, 0, 127, 0.24)';
        ctx.beginPath();
        ctx.arc(c.x, c.y, radius * 1.16, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = core;
        ctx.beginPath();
        ctx.arc(c.x, c.y, radius * 0.82, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255, 255, 255, 0.88)';
        ctx.beginPath();
        ctx.arc(c.x - radius * 0.15, c.y - radius * 0.15, radius * 0.32, 0, Math.PI * 2);
        ctx.fill();

        for (let spark = 0; spark <= 2; spark++) {
          const angle = arenaPhase * (2.2 + spark * 0.35) + i * 1.7 + spark;
          const distance = radius * (1.15 + 0.45 * Math.sin(arenaPhase * 4 + spark));
          const sx = c.x + Math.cos(angle) * distance;
          const sy = c.y + Math.sin(angle) * distance;

          ctx.strokeStyle = (i % 2 === 0) ? 'rgba(0, 245, 255, 0.5)' : 'rgba(255, 0, 127, 0.5)';
          ctx.lineWidth = radius * 0.045;
          ctx.beginPath();
          ctx.moveTo(sx - radius * 0.12, sy);
          ctx.lineTo(sx + radius * 0.12, sy);
          ctx.stroke();

          ctx.strokeStyle = (i % 2 === 0) ? 'rgba(0, 245, 255, 0.35)' : 'rgba(255, 0, 127, 0.35)';
          ctx.beginPath();
          ctx.moveTo(sx, sy - radius * 0.12);
          ctx.lineTo(sx, sy + radius * 0.12);
          ctx.stroke();
        }

        if (i === 0) {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
          ctx.beginPath();
          ctx.arc(c.x, c.y, radius * 0.54, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = secondary;
          ctx.beginPath();
          ctx.arc(c.x, c.y, radius * 0.34, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(c.x - radius * 0.08, c.y - radius * 0.10, radius * 0.13, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = (i % 2 === 0) ? 'rgba(0, 245, 255, 0.65)' : 'rgba(255, 0, 127, 0.65)';
          ctx.lineWidth = radius * 0.075;
          ctx.beginPath();
          ctx.arc(c.x, c.y, radius * 0.68, 0, Math.PI * 2);
          ctx.stroke();

          const forward = { x: dir.x, y: dir.y };
          const side = { x: -forward.y, y: forward.x };

          const eyeForwardDist = radius * 0.35;
          const eyeSideDist = radius * 0.26;
          const eyeRadius = radius * 0.16;

          let gazeShift = { x: 0, y: 0 };
          const allFoods = [...foods];
          if (specialFood) allFoods.push(specialFood);
          if (shrinkFood) allFoods.push(shrinkFood);

          if (allFoods.length > 0) {
            let nearestDist = Infinity;
            let nearest = null;
            allFoods.forEach(f => {
              const fx = (f.x + 0.5) * cellW;
              const fy = (f.y + 0.5) * cellH;
              const d = Math.pow(fx - c.x, 2) + Math.pow(fy - c.y, 2);
              if (d < nearestDist) {
                nearestDist = d;
                nearest = { x: fx, y: fy };
              }
            });
            if (nearest) {
              const fDx = nearest.x - c.x;
              const fDy = nearest.y - c.y;
              const dist = Math.hypot(fDx, fDy);
              if (dist > 0.001) {
                const maxTravel = radius * 0.10;
                gazeShift = { x: (fDx / dist) * maxTravel, y: (fDy / dist) * maxTravel };
              }
            }
          }

          const eyeA = {
            x: c.x + forward.x * eyeForwardDist + side.x * eyeSideDist,
            y: c.y + forward.y * eyeForwardDist + side.y * eyeSideDist
          };
          const eyeB = {
            x: c.x + forward.x * eyeForwardDist - side.x * eyeSideDist,
            y: c.y + forward.y * eyeForwardDist - side.y * eyeSideDist
          };

          [eyeA, eyeB].forEach(eyePos => {
            const trackPos = { x: eyePos.x + gazeShift.x * 0.6, y: eyePos.y + gazeShift.y * 0.6 };

            ctx.fillStyle = 'rgba(224, 247, 250, 0.45)';
            ctx.beginPath();
            ctx.arc(trackPos.x, trackPos.y, eyeRadius * 1.8, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'rgba(224, 247, 250, 0.95)';
            ctx.beginPath();
            ctx.arc(trackPos.x, trackPos.y, eyeRadius * 0.85, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(trackPos.x, trackPos.y, eyeRadius * 0.40, 0, Math.PI * 2);
            ctx.fill();
          });
        }
      }
    }

    function render(now) {
      arenaPhase = (arenaPhase + 0.018) % (2 * Math.PI);
      foodPulse = 0.75 + 0.40 * (0.5 + 0.5 * Math.sin(now / 650 * Math.PI * 2));

      if (!isGameOver) {
        const tickDelay = getTickDelay();
        const elapsed = now - lastStepTime;
        moveProgress = Math.min(1, elapsed / tickDelay);
        if (elapsed >= tickDelay) {
          step();
          lastStepTime = now;
          moveProgress = 0;
        }
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawVoidBackdrop(canvas.width, canvas.height, arenaPhase);
      drawBoundaries(canvas.width, canvas.height);
      drawFoods();

      const interpolatedCenters = snake.map((seg, idx) => {
        const prev = prevSnake[idx] || seg;
        let dx = seg.x - prev.x;
        let dy = seg.y - prev.y;

        if (Math.abs(dx) > 1.5) dx = (dx > 0) ? dx - boardCols : dx + boardCols;
        if (Math.abs(dy) > 1.5) dy = (dy > 0) ? dy - boardRows : dy + boardRows;

        const rx = (prev.x + dx * moveProgress + boardCols) % boardCols;
        const ry = (prev.y + dy * moveProgress + boardRows) % boardRows;
        return {
          x: (rx + 0.5) * cellW,
          y: (ry + 0.5) * cellH
        };
      });

      const radius = Math.min(cellW, cellH) * 0.43;
      drawPlasmaSnake(interpolatedCenters, radius, direction);

      requestAnimationFrame(render);
    }

    resetGame();
    requestAnimationFrame(render);
  </script>
</body>
